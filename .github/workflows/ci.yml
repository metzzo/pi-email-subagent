name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node 22 · Pi ${{ matrix.pi }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Wildcard peers are host-provided; 0.1.0 support is validated only on this Pi line.
        pi: ["0.84.2"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Verify the supported Pi development pins
        env:
          SUPPORTED_PI_VERSION: ${{ matrix.pi }}
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const names = [
            '@earendil-works/pi-agent-core',
            '@earendil-works/pi-ai',
            '@earendil-works/pi-coding-agent',
            '@earendil-works/pi-tui',
          ];
          for (const name of names) {
            if (pkg.devDependencies[name] !== process.env.SUPPORTED_PI_VERSION) {
              throw new Error(`${name} must be pinned to supported Pi ${process.env.SUPPORTED_PI_VERSION}`);
            }
          }
          if (pkg.devDependencies.typebox !== '1.3.7') {
            throw new Error('typebox must be pinned to the supported Pi host version 1.3.7');
          }
          NODE
      - run: npm run validate
      # Pi core packages are host-provided peers; audit only dependencies this package installs.
      - run: npm audit --omit=dev --omit=peer
      - run: git diff --check

  package-allowlist:
    name: Package allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Enforce authoritative package surface policy
        run: npm run check:package
