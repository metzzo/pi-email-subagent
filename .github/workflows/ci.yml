name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node 22 · Pi ${{ matrix.pi }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Both SDK baselines run the same source and regression tests.
        pi: ["1.5.2", "0.87.1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Verify the supported Pi development pins
        env:
          SUPPORTED_PI_VERSION: "1.5.2"
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const names = [
            '@earendil-works/pi-agent-core',
            '@earendil-works/pi-ai',
            '@earendil-works/pi-coding-agent',
            '@earendil-works/pi-tui',
          ];
          for (const name of names) {
            if (pkg.devDependencies[name] !== process.env.SUPPORTED_PI_VERSION) {
              throw new Error(`${name} must be pinned to supported Pi ${process.env.SUPPORTED_PI_VERSION}`);
            }
          }
          if (pkg.devDependencies.typebox !== '1.3.27') {
            throw new Error('typebox must be pinned to the supported Pi host version 1.3.27');
          }
          NODE
      - name: Install the older SDK without changing the committed pins
        if: matrix.pi == '0.87.1'
        run: npm install --no-save --package-lock=false @earendil-works/pi-agent-core@0.87.1 @earendil-works/pi-ai@0.87.1 @earendil-works/pi-coding-agent@0.87.1 @earendil-works/pi-tui@0.87.1 @earendil-works/pi-server@0.87.1 typebox@1.3.7
      - name: Validate the pinned baseline and coverage gate
        if: matrix.pi == '1.5.2'
        run: npm run validate
      - name: Check compatibility with the older SDK
        if: matrix.pi == '0.87.1'
        run: npm run check && npm run check:licenses && npm test && npm run test:integration && npm run test:e2e
      - name: Surface the redirected test report on failure
        if: failure()
        run: |
          if [ -f .test-workspaces/coverage-tests.log ]; then
            cat .test-workspaces/coverage-tests.log
          else
            echo "No coverage test report was produced; validation failed before the test reporter opened."
          fi
      - name: Retain deterministic test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ matrix.os }}-pi-${{ matrix.pi }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .test-workspaces/coverage-tests.log
            .test-workspaces/coverage-raw.lcov
            .test-workspaces/coverage.lcov
      # Pi core packages are host-provided peers; audit only dependencies this package installs.
      - run: npm audit --omit=dev --omit=peer
      - run: git diff --check

  package-allowlist:
    name: Package allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Enforce authoritative package surface policy
        run: npm run check:package
