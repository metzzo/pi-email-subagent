name: Bug report
description: Report a reproducible defect without sensitive mailbox or credential data
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities belong in a private advisory; see SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: pi-email-subagent commit/version, Pi version, Node version, OS
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Redact addresses, paths, prompts, mail bodies, and credentials as needed.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Validation and diagnostics
      description: Relevant errors and focused test results. Do not attach raw private state files.
